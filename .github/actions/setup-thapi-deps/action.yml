name: 'Setup THAPI dependencies'
inputs:
  cache-dir:
    description: 'Directory for spack cache'
    required: true
  install-llvm:
    description: 'Install LLVM/Clang and add related workarounds'
    required: true
runs:
  using: "composite"
  steps:
    - name: Install apt-get packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libnuma-dev re2c protobuf-compiler libprotobuf-dev elfutils libelf-dev libdw-dev
    - name: Checkout Spack
      uses: actions/checkout@v6
      with:
        repository: spack/spack
        ref: releases/latest
        path: external/spack
    - name: Add THAPI repo
      shell: bash
      run: |
        . external/spack/share/spack/setup-env.sh
        spack repo add ./
    - name: Find compilers and external packages
      shell: bash
      run: |
        # Find external packages known to spack (avoid bzip2 and xz since
        # they cause build failures in elfutils, and libxml2 since externals
        # in system paths don't get added to PKG_CONFIG_PATH).
        #
        # llvm is declared by hand in a later step, because neither of these
        # commands records the `+python` variant h2yaml needs. Any entry they
        # leave behind would shadow it, so drop theirs. `compiler find` has no
        # --exclude, hence the `rm`.
        . external/spack/share/spack/setup-env.sh
        spack compiler find
        spack compiler rm -a llvm || true
        spack external find --all --exclude llvm --exclude bzip2 --exclude xz --exclude libxml2
    - name: Pin the target microarchitecture
      shell: bash
      run: |
        # Spack puts the microarchitecture in the dag hash, and the runner pool
        # is a mix of cpu generations, so a package built on one runner does not
        # match the same package on another and the build cache never hits.
        #
        # `targets:granularity:generic` is not enough: it still picks the *best*
        # generic target the host supports, so an avx512 runner (icelake,
        # sapphire rapids) concretizes to x86_64_v4 while a zen2/zen3 one gets
        # x86_64_v3 -- the pool just splits two ways instead of five. Requiring
        # an explicit target is what actually makes the hashes stable.
        #
        # x86_64_v3 (avx2) is the highest level every runner in the pool
        # supports. If one ever does not, `host_compatible: true` makes the
        # solve fail loudly rather than emit illegal instructions.
        . external/spack/share/spack/setup-env.sh
        spack config add "packages:all:require:target=x86_64_v3"
    - name: Declare the apt re2c, protobuf and elfutils as externals
      shell: bash
      run: |
        # The three most expensive packages in the dependency jobs (~17, ~17
        # and ~6 min) that apt already ships. `spack external find` cannot see
        # them -- no recipe declares `executables` or `libraries` -- so declare
        # them by hand.
        #
        # This does pin PR CI to Noble's older protobuf and elfutils; the
        # weekly cron `from_scratch` job installs with no externals and covers
        # the current ones.
        . external/spack/share/spack/setup-env.sh
        for pkg_tool in re2c:re2c protobuf:protoc elfutils:eu-readelf; do
          pkg=${pkg_tool%:*}
          tool=${pkg_tool#*:}
          python3 scripts/gen-external.py "${pkg}" --version-from "${tool}" \
            > ${{ github.workspace }}/${pkg}-external.yaml
          spack config add -f ${{ github.workspace }}/${pkg}-external.yaml
          # The script only writes config, so check Spack took it: an
          # external node has a `.external.path`, everything else null.
          spack spec -j "${pkg}" | grep -v '^==>' \
            | jq -e --arg p "${pkg}" '.spec.nodes[] | select(.name == $p) | .external.path' \
            || { echo "${pkg} did not resolve to the external"; exit 1; }
        done
    - name: Setup spack mirror
      shell: bash
      run: |
        # Setup a spack mirror to store built packages. More info can be
        # found here:
        # https://spack.readthedocs.io/en/latest/binary_caches.html
        . external/spack/share/spack/setup-env.sh
        spack mirror add --autopush --unsigned thapi_cache ${{ inputs.cache-dir }}
    - name: Install llvm/clang version in thapi@develop spec
      shell: bash
      if: ${{ inputs.install-llvm == 'true' }}
      run: |
        # Source spack
        . external/spack/share/spack/setup-env.sh

        # The llvm major version thapi@develop wants. `spack spec -j` writes its
        # status lines ("==> Using cached archive: ...") to stdout alongside the
        # json, so they have to be stripped before jq sees them.
        #
        # A spec can hold several llvm nodes (same version, different variants),
        # so collapse them to the distinct majors and insist on exactly one --
        # two would otherwise be concatenated into an unusable "22\n22".
        LLVM_VER=$( spack spec -j thapi@develop | grep -v '^==>' \
          | jq -r '[.spec.nodes[] | select(.name == "llvm") | .version | split(".")[0]]
                   | unique | join(" ")' )
        if [ "$( echo "${LLVM_VER}" | wc -w )" -ne 1 ]; then
          echo "expected exactly one llvm major version, got: '${LLVM_VER}'"
          exit 1
        fi

        # Add llvm to apt repository.
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        REPO="deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VER} main"
        echo "$REPO" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update

        # Install llvm/clang
        sudo apt-get install libllvm${LLVM_VER} llvm-${LLVM_VER} llvm-${LLVM_VER}-dev
        sudo apt-get install clang-${LLVM_VER} libclang-${LLVM_VER}-dev python3-clang-${LLVM_VER}

        # Pick up what apt pulled in, with the same exclusions as above.
        spack compiler find
        spack compiler rm -a llvm || true
        spack external find --all --exclude llvm --exclude bzip2 --exclude xz --exclude libxml2

        LLVM_FULL_VER=`llvm-config-${LLVM_VER} --version`
        echo "LLVM_FULL_VER=${LLVM_FULL_VER}" >> ${GITHUB_ENV}
        # The next step needs the major version too.
        echo "LLVM_VER=${LLVM_VER}" >> ${GITHUB_ENV}
    - name: Declare the apt llvm as an external with +python
      shell: bash
      if: ${{ inputs.install-llvm == 'true' }}
      run: |
        # `spack external find` never records +python (it picks variants from
        # executables and never looks for clang's python bindings), so h2yaml's
        # llvm@18:+clang+python would go unsatisfied and Spack would rebuild LLVM.
        # The helper below declares the external properly; apt splits the bindings
        # into /usr/lib/python3/dist-packages, which it finds and links in.
        # Same script the README tells users to run.
        . external/spack/share/spack/setup-env.sh
        PYVER=$( spack spec -j h2yaml | grep -v '^==>' \
          | jq -r '[.spec.nodes[] | select(.name == "python") | .version | split(".")[:2] | join(".")]
                   | unique | join(" ")' )
        if [ "$( echo "${PYVER}" | wc -w )" -ne 1 ]; then
          echo "expected exactly one python version, got: '${PYVER}'"
          exit 1
        fi
        python3 scripts/gen-llvm-external.py /usr/lib/llvm-${LLVM_VER} \
          --python-version "${PYVER}" \
          --overlay-dir ${{ github.workspace }} \
          > ${{ github.workspace }}/llvm-external.yaml
        spack config add -f ${{ github.workspace }}/llvm-external.yaml
