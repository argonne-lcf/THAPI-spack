name: Install Thapi master and develop every week
on:
  schedule:
    # At 00:00 on Sunday.”
    - cron: "0 0 * * 0"
  workflow_dispatch:
env:
  SPACK_OPT: "--concurrent-packages 2 --show-log-on-error --fail-fast"
  CACHE_DIR: "${{ github.workspace }}/thapi_cache_${{ github.run_id }}"
jobs:
  # Install with nothing pre-arranged: no `spack external find`, no system llvm,
  # no build cache. Checks that THAPI installs on a bare machine.
  from_scratch:
    strategy:
      fail-fast: false
      matrix:
        version: ['thapi@master', 'thapi@develop']
    runs-on: ubuntu-latest
    name: Install ${{ matrix.version }} (from scratch)
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout Spack
      uses: actions/checkout@v6
      with:
        repository: spack/spack
        ref: releases/latest
        path: external/spack
    - name: Activate
      run: |
        . external/spack/share/spack/setup-env.sh
        spack repo add ./
    - name: Install ${{ matrix.version }}
      run: |
        . external/spack/share/spack/setup-env.sh
        spack install $SPACK_OPT ${{ matrix.version }}

  # Exercise the same fast path the PR CI uses (external find + apt llvm +
  # hand-declared +python external). PR CI only runs when someone opens a PR, so
  # without this the fast path can rot unnoticed during a quiet week.
  fast_path:
    runs-on: ubuntu-latest
    name: Install thapi@develop (fast path)
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout dependencies (spack,...)
      uses: ./.github/actions/setup-thapi-deps
      with:
        cache-dir: ${{ env.CACHE_DIR }}
        install-llvm: 'true'
    - name: Check llvm resolves to the external, not a build
      run: |
        # Concretization alone shows whether llvm is external ([e]). Checking it
        # here fails in seconds; after the install it costs an llvm build.
        . external/spack/share/spack/setup-env.sh
        spack spec -I thapi@develop ^llvm@${LLVM_FULL_VER} | grep -E '^\s*\[e\].*\^llvm@' \
          || { echo "llvm did not resolve to the external"; exit 1; }
    - name: Install thapi@develop
      run: |
        . external/spack/share/spack/setup-env.sh
        spack install $SPACK_OPT thapi@develop ^llvm@${LLVM_FULL_VER}
