name: Lint checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  ruff_format:
    runs-on: ubuntu-latest
    name: Check formatting with ruff
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: ruff format check
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check --diff"
